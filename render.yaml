services:
  - type: redis
    name: databoy-staging-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: databoy-backend-staging
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: LIPILA_ENV
        value: sandbox
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_STORE
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: databoy-staging-redis
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_REQUIRED
        value: "true"
      - key: R2_REGION
        value: auto
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
