<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Professional LinkedIn Surface Gradient -->
    <radialGradient id="socBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="60%" stop-color="#050818" />
      <stop offset="100%" stop-color="#02030b" />
    </radialGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Circular background surface -->
  <circle cx="256" cy="256" r="256" fill="url(#socBg)" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#glowRing)" stroke-width="4.5" stroke-opacity="0.65" />

  <!-- Master head silhouette scaled and centered perfectly -->
  <g transform="translate(100, 100) scale(0.61)">
    <!-- Smooth Head Silhouette -->
    <path d="M190 380 C150 350, 130 270, 165 185 C190 120, 260 100, 320 145 C350 168, 365 200, 360 235 C358 248, 350 258, 345 270 C352 278, 354 288, 346 298 C338 308, 340 318, 328 328 C295 360, 245 385, 190 380 Z" 
          fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Circuit Lines & Nodes -->
    <path d="M220 180 L270 210 L300 170" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M270 210 L260 280 L200 310" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M260 280 L310 285" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M200 310 L180 250 L220 180" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="180" cy="250" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="220" cy="180" r="11" fill="#6366f1" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="300" cy="170" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="270" cy="210" r="11" fill="#6366f1" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="260" cy="280" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="200" cy="310" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="310" cy="285" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  </g>
</svg>
